<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数字分类统计器 - 手机版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .header {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .header h1 i {
            font-size: 2rem;
        }
        
        .tabs {
            display: flex;
            background: #f0f4ff;
            border-bottom: 2px solid #e0e7ff;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        
        .tab.active {
            color: #4facfe;
            background: white;
            border-bottom: 3px solid #4facfe;
        }
        
        .tab-content {
            display: none;
            padding: 20px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .rules {
            background: #f8f9fa;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
            border-left: 4px solid #4facfe;
        }
        
        .rules h3 {
            color: #4facfe;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .rules ul {
            list-style: none;
            padding-left: 10px;
        }
        
        .rules li {
            margin: 5px 0;
            padding-left: 20px;
            position: relative;
        }
        
        .rules li:before {
            content: "•";
            color: #4facfe;
            position: absolute;
            left: 0;
        }
        
        .input-section {
            padding: 20px;
            background: white;
        }
        
        .number-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .number-input input {
            flex: 1;
            padding: 18px;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }
        
        .number-input input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
        }
        
        .add-btn {
            background: linear-gradient(to right, #43e97b 0%, #38f9d7 100%);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .add-btn:active {
            transform: scale(0.95);
        }
        
        .quick-numbers {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .num-btn {
            background: #f0f4ff;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            padding: 15px 5px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #4facfe;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .num-btn:active {
            background: #4facfe;
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card.big-odd { border-top: 5px solid #ff6b6b; }
        .stat-card.small-odd { border-top: 5px solid #4ecdc4; }
        .stat-card.big-even { border-top: 5px solid #45b7d1; }
        .stat-card.small-even { border-top: 5px solid #96ceb4; }
        
        .stat-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #666;
        }
        
        .stat-card .count {
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .big-odd .count { color: #ff6b6b; }
        .small-odd .count { color: #4ecdc4; }
        .big-even .count { color: #45b7d1; }
        .small-even .count { color: #96ceb4; }
        
        /* 最新50个统计样式 */
        .recent-stats {
            background: white;
            padding: 20px;
        }
        
        .recent-stats h3 {
            color: #4facfe;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        
        .stats-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stats-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            color: #666;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .stats-btn.active {
            background: #4facfe;
            color: white;
            border-color: #4facfe;
        }
        
        .recent-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .recent-stat-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        
        .recent-stat-card h4 {
            font-size: 1rem;
            color: #666;
            margin-bottom: 8px;
        }
        
        .recent-stat-card .recent-count {
            font-size: 2rem;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .percentage {
            font-size: 0.9rem;
            color: #888;
            font-weight: bold;
        }
        
        .number-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .number-item {
            display: inline-block;
            margin: 5px;
            padding: 8px 15px;
            background: white;
            border-radius: 20px;
            border: 1px solid #e0e0e0;
            font-weight: bold;
        }
        
        .number-item.big-odd { color: #ff6b6b; border-color: #ff6b6b; }
        .number-item.small-odd { color: #4ecdc4; border-color: #4ecdc4; }
        .number-item.big-even { color: #45b7d1; border-color: #45b7d1; }
        .number-item.small-even { color: #96ceb4; border-color: #96ceb4; }
        
        .history {
            padding: 20px;
            background: white;
        }
        
        .history h3 {
            color: #4facfe;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        
        #history-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            animation: fadeIn 0.5s;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-item.new {
            background: #f0fff4;
            border-radius: 8px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .actions {
            display: flex;
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .action-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }
        
        .action-btn:active {
            transform: scale(0.95);
        }
        
        .reset-btn {
            background: linear-gradient(to right, #ff9a9e 0%, #fad0c4 100%);
            color: white;
        }
        
        .export-btn {
            background: linear-gradient(to right, #a1c4fd 0%, #c2e9fb 100%);
            color: white;
        }
        
        .empty-history {
            text-align: center;
            color: #999;
            padding: 30px;
            font-style: italic;
        }
        
        .empty-stats {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }
        
        /* 时间显示 */
        .time {
            font-size: 0.8rem;
            color: #999;
        }
        
        /* 响应式调整 */
        @media (max-width: 400px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .quick-numbers {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .recent-stats-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* 图标样式 */
        .icon {
            font-size: 1.2em;
            display: inline-block;
        }
        
        /* 分类标签 */
        .category-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
        }
        
        .category-大单 { background: #ff6b6b; }
        .category-小单 { background: #4ecdc4; }
        .category-大双 { background: #45b7d1; }
        .category-小双 { background: #96ceb4; }
        
        .info-text {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-calculator"></i> 数字分类统计器</h1>
            <p>每三分钟输入一个数字，自动分类统计</p>
        </div>
        
        <!-- 标签页 -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('input')">输入</div>
            <div class="tab" onclick="switchTab('recent')">最近50个</div>
            <div class="tab" onclick="switchTab('history')">历史</div>
        </div>
        
        <!-- 输入页面 -->
        <div class="tab-content active" id="tab-input">
            <div class="rules">
                <h3><i class="fas fa-info-circle"></i> 分类规则</h3>
                <ul>
                    <li><strong>0-13</strong>：单数 → 小单，双数 → 小双</li>
                    <li><strong>14-27</strong>：单数 → 大单，双数 → 大双</li>
                </ul>
            </div>
            
            <div class="input-section">
                <div class="number-input">
                    <input type="number" id="numberInput" min="0" max="27" placeholder="输入0-27的数字">
                    <button class="add-btn" id="addBtn">
                        <i class="fas fa-plus"></i> 添加
                    </button>
                </div>
                
                <div class="quick-numbers">
                    <!-- 常用数字按钮 -->
                    <button class="num-btn" onclick="quickInput(0)">0</button>
                    <button class="num-btn" onclick="quickInput(5)">5</button>
                    <button class="num-btn" onclick="quickInput(10)">10</button>
                    <button class="num-btn" onclick="quickInput(13)">13</button>
                    <button class="num-btn" onclick="quickInput(14)">14</button>
                    <button class="num-btn" onclick="quickInput(18)">18</button>
                    <button class="num-btn" onclick="quickInput(22)">22</button>
                    <button class="num-btn" onclick="quickInput(27)">27</button>
                </div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card big-odd">
                    <h3>大单 </h3>
                    <div class="count" id="count-big-odd">0</div>
                    <div class="category-tag category-大单">大单</div>
                </div>
                
                <div class="stat-card small-odd">
                    <h3>小单 </h3>
                    <div class="count" id="count-small-odd">0</div>
                    <div class="category-tag category-小单">小单</div>
                </div>
                
                <div class="stat-card big-even">
                    <h3>大双 </h3>
                    <div class="count" id="count-big-even">0</div>
                    <div class="category-tag category-大双">大双</div>
                </div>
                
                <div class="stat-card small-even">
                    <h3>小双 </h3>
                    <div class="count" id="count-small-even">0</div>
                    <div class="category-tag category-小双">小双</div>
                </div>
            </div>
            
            <div class="actions">
                <button class="action-btn reset-btn" id="resetBtn">
                    <i class="fas fa-redo"></i> 重置统计
                </button>
                <button class="action-btn export-btn" id="exportBtn">
                    <i class="fas fa-download"></i> 导出数据
                </button>
            </div>
        </div>
        
        <!-- 最近50个统计页面 -->
        <div class="tab-content" id="tab-recent">
            <div class="recent-stats">
                <h3>
                    <span><i class="fas fa-chart-bar"></i> 最近50个数字统计</span>
                    <span id="recent-count">0/50</span>
                </h3>
                
                <div class="stats-controls">
                    <button class="stats-btn active" onclick="showRecentStats('count')">数量统计</button>
                    <button class="stats-btn" onclick="showRecentStats('percentage')">百分比</button>
                    <button class="stats-btn" onclick="showRecentStats('trend')">趋势</button>
                </div>
                
                <div id="recent-stats-content">
                    <!-- 这里会动态显示最近50个的统计 -->
                    <div class="empty-stats" id="recent-empty">
                        <i class="fas fa-chart-line fa-2x" style="color:#ccc; margin-bottom:15px;"></i><br>
                        暂无最近50个数字的统计
                    </div>
                    
                    <div id="recent-stats-grid" class="recent-stats-grid" style="display:none;">
                        <div class="recent-stat-card">
                            <h4>大单</h4>
                            <div class="recent-count" id="recent-big-odd">0</div>
                            <div class="percentage" id="recent-big-odd-pct">0%</div>
                        </div>
                        
                        <div class="recent-stat-card">
                            <h4>小单</h4>
                            <div class="recent-count" id="recent-small-odd">0</div>
                            <div class="percentage" id="recent-small-odd-pct">0%</div>
                        </div>
                        
                        <div class="recent-stat-card">
                            <h4>大双</h4>
                            <div class="recent-count" id="recent-big-even">0</div>
                            <div class="percentage" id="recent-big-even-pct">0%</div>
                        </div>
                        
                        <div class="recent-stat-card">
                            <h4>小双</h4>
                            <div class="recent-count" id="recent-small-even">0</div>
                            <div class="percentage" id="recent-small-even-pct">0%</div>
                        </div>
                    </div>
                    
                    <div id="recent-numbers" style="display:none;">
                        <h4 style="margin-top:20px; margin-bottom:10px; color:#666;">
                            <i class="fas fa-list-ol"></i> 最近50个数字列表
                        </h4>
                        <div class="number-list" id="recent-numbers-list">
                            <!-- 这里显示最近50个数字 -->
                        </div>
                    </div>
                </div>
                
                <div class="info-text">
                    <i class="fas fa-info-circle"></i> 只统计最近输入的50个数字，更早的数字会自动移除
                </div>
            </div>
        </div>
        
        <!-- 历史页面 -->
        <div class="tab-content" id="tab-history">
            <div class="history">
                <h3><i class="fas fa-history"></i> 完整输入历史</h3>
                <div id="history-list">
                    <div class="empty-history">暂无输入记录</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化统计数据
        let stats = {
            '大单': 0,
            '小单': 0,
            '大双': 0,
            '小双': 0
        };
        
        let history = [];
        let recentHistory = []; // 只保存最近50个记录
        let currentStatsView = 'count';
        
        // 获取DOM元素
        const numberInput = document.getElementById('numberInput');
        const addBtn = document.getElementById('addBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const historyList = document.getElementById('history-list');
        const recentCountSpan = document.getElementById('recent-count');
        
        // 从本地存储加载数据
        function loadFromStorage() {
            const savedStats = localStorage.getItem('numberStats');
            const savedHistory = localStorage.getItem('numberHistory');
            const savedRecent = localStorage.getItem('recentHistory');
            
            if (savedStats) {
                stats = JSON.parse(savedStats);
            }
            
            if (savedHistory) {
                history = JSON.parse(savedHistory);
            }
            
            if (savedRecent) {
                recentHistory = JSON.parse(savedRecent);
            }
            
            updateDisplay();
            updateRecentStatsDisplay();
        }
        
        // 保存到本地存储
        function saveToStorage() {
            localStorage.setItem('numberStats', JSON.stringify(stats));
            localStorage.setItem('numberHistory', JSON.stringify(history));
            localStorage.setItem('recentHistory', JSON.stringify(recentHistory));
        }
        
        // 分类函数
        function classifyNumber(num) {
            if (num >= 0 && num <= 13) {
                return num % 2 === 1 ? '小单' : '小双';
            } else if (num >= 14 && num <= 27) {
                return num % 2 === 1 ? '大单' : '大双';
            }
            return null;
        }
        
        // 更新显示
        function updateDisplay() {
            document.getElementById('count-big-odd').textContent = stats['大单'];
            document.getElementById('count-small-odd').textContent = stats['小单'];
            document.getElementById('count-big-even').textContent = stats['大双'];
            document.getElementById('count-small-even').textContent = stats['小双'];
            
            // 更新历史记录
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">暂无输入记录</div>';
            } else {
                let html = '';
                // 显示最近20条记录，最新的在最上面
                const recentHistory = [...history].reverse().slice(0, 20);
                
                recentHistory.forEach((record, index) => {
                    const isNew = index === 0;
                    html += `
                        <div class="history-item ${isNew ? 'new' : ''}">
                            <div>
                                <strong>${record.number}</strong> → 
                                <span class="category-tag category-${record.category}">${record.category}</span>
                            </div>
                            <div class="time">${record.time}</div>
                        </div>
                    `;
                });
                historyList.innerHTML = html;
            }
        }
        
        // 更新最近50个统计显示
        function updateRecentStatsDisplay() {
            const recentCount = recentHistory.length;
            recentCountSpan.textContent = `${recentCount}/50`;
            
            // 如果没有最近数据
            if (recentCount === 0) {
                document.getElementById('recent-empty').style.display = 'block';
                document.getElementById('recent-stats-grid').style.display = 'none';
                document.getElementById('recent-numbers').style.display = 'none';
                return;
            }
            
            // 隐藏空状态，显示统计
            document.getElementById('recent-empty').style.display = 'none';
            document.getElementById('recent-stats-grid').style.display = 'grid';
            document.getElementById('recent-numbers').style.display = 'block';
            
            // 计算最近50个的统计
            const recentStats = {
                '大单': 0,
                '小单': 0,
                '大双': 0,
                '小双': 0
            };
            
            recentHistory.forEach(record => {
                recentStats[record.category]++;
            });
            
            // 更新数量显示
            document.getElementById('recent-big-odd').textContent = recentStats['大单'];
            document.getElementById('recent-small-odd').textContent = recentStats['小单'];
            document.getElementById('recent-big-even').textContent = recentStats['大双'];
            document.getElementById('recent-small-even').textContent = recentStats['小双'];
            
            // 计算并显示百分比
            const total = recentCount;
            const bigOddPct = total > 0 ? ((recentStats['大单'] / total * 100).toFixed(1)) : 0;
            const smallOddPct = total > 0 ? ((recentStats['小单'] / total * 100).toFixed(1)) : 0;
            const bigEvenPct = total > 0 ? ((recentStats['大双'] / total * 100).toFixed(1)) : 0;
            const smallEvenPct = total > 0 ? ((recentStats['小双'] / total * 100).toFixed(1)) : 0;
            
            document.getElementById('recent-big-odd-pct').textContent = `${bigOddPct}%`;
            document.getElementById('recent-small-odd-pct').textContent = `${smallOddPct}%`;
            document.getElementById('recent-big-even-pct').textContent = `${bigEvenPct}%`;
            document.getElementById('recent-small-even-pct').textContent = `${smallEvenPct}%`;
            
            // 根据当前视图模式调整显示
            updateStatsView();
            
            // 更新数字列表
            updateRecentNumbersList();
        }
        
        // 更新最近50个数字列表
        function updateRecentNumbersList() {
            const numbersList = document.getElementById('recent-numbers-list');
            let html = '';
            
            // 从最新到最旧显示
            recentHistory.slice().reverse().forEach(record => {
                const categoryClass = record.category === '大单' ? 'big-odd' :
                                   record.category === '小单' ? 'small-odd' :
                                   record.category === '大双' ? 'big-even' : 'small-even';
                
                html += `<span class="number-item ${categoryClass}">${record.number}</span>`;
            });
            
            numbersList.innerHTML = html;
        }
        
        // 更新统计视图模式
        function updateStatsView() {
            const recentCount = recentHistory.length;
            if (recentCount === 0) return;
            
            const recentStats = {
                '大单': parseInt(document.getElementById('recent-big-odd').textContent),
                '小单': parseInt(document.getElementById('recent-small-odd').textContent),
                '大双': parseInt(document.getElementById('recent-big-even').textContent),
                '小双': parseInt(document.getElementById('recent-small-even').textContent)
            };
            
            const total = recentCount;
            
            // 获取百分比元素
            const bigOddPct = document.getElementById('recent-big-odd-pct');
            const smallOddPct = document.getElementById('recent-small-odd-pct');
            const bigEvenPct = document.getElementById('recent-big-even-pct');
            const smallEvenPct = document.getElementById('recent-small-even-pct');
            
            // 获取数量元素
            const bigOddCount = document.getElementById('recent-big-odd');
            const smallOddCount = document.getElementById('recent-small-odd');
            const bigEvenCount = document.getElementById('recent-big-even');
            const smallEvenCount = document.getElementById('recent-small-even');
            
            if (currentStatsView === 'count') {
                // 显示数量，隐藏百分比
                bigOddCount.style.display = 'block';
                smallOddCount.style.display = 'block';
                bigEvenCount.style.display = 'block';
                smallEvenCount.style.display = 'block';
                
                bigOddPct.style.display = 'block';
                smallOddPct.style.display = 'block';
                bigEvenPct.style.display = 'block';
                smallEvenPct.style.display = 'block';
            } else if (currentStatsView === 'percentage') {
                // 只显示百分比
                bigOddCount.style.display = 'none';
                smallOddCount.style.display = 'none';
                bigEvenCount.style.display = 'none';
                smallEvenCount.style.display = 'none';
                
                bigOddPct.style.display = 'block';
                smallOddPct.style.display = 'block';
                bigEvenPct.style.display = 'block';
                smallEvenPct.style.display = 'block';
            } else if (currentStatsView === 'trend') {
                // 显示数量和百分比
                bigOddCount.style.display = 'block';
                smallOddCount.style.display = 'block';
                bigEvenCount.style.display = 'block';
                smallEvenCount.style.display = 'block';
                
                bigOddPct.style.display = 'block';
                smallOddPct.style.display = 'block';
                bigEvenPct.style.display = 'block';
                smallEvenPct.style.display = 'block';
            }
        }
        
        // 显示统计视图
        function showRecentStats(view) {
            currentStatsView = view;
            
            // 更新按钮状态
            document.querySelectorAll('.stats-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateStatsView();
        }
        
        // 添加数字
        function addNumber() {
            const num = parseInt(numberInput.value);
            
            if (isNaN(num)) {
                alert('请输入有效数字！');
                return;
            }
            
            if (num < 0 || num > 27) {
                alert('请输入0-27之间的数字！');
                return;
            }
            
            const category = classifyNumber(num);
            if (!category) {
                alert('数字分类错误！');
                return;
            }
            
            // 更新总统计
            stats[category]++;
            
            // 添加到完整历史
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            
            const record = {
                number: num,
                category: category,
                time: timeStr
            };
            
            history.push(record);
            
            // 添加到最近50个历史
            recentHistory.push(record);
            
            // 保持最近50个记录
            if (recentHistory.length > 50) {
                recentHistory.shift(); // 移除最早的记录
            }
            
            // 清空输入框并聚焦
            numberInput.value = '';
            numberInput.focus();
            
            // 更新所有显示
            updateDisplay();
            updateRecentStatsDisplay();
            
            // 保存到本地存储
            saveToStorage();
            
            // 添加成功动画
            addBtn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                addBtn.style.transform = 'scale(1)';
            }, 150);
            
            // 震动反馈（如果支持）
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }
        
        // 快速输入
        function quickInput(num) {
            numberInput.value = num;
            addNumber();
        }
        
        // 重置统计
        function resetStats() {
            if (confirm('确定要重置所有统计数据吗？')) {
                stats = {
                    '大单': 0,
                    '小单': 0,
                    '大双': 0,
                    '小双': 0
                };
                history = [];
                recentHistory = [];
                updateDisplay();
                updateRecentStatsDisplay();
                saveToStorage();
                
                // 重置按钮动画
                resetBtn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    resetBtn.style.transform = 'scale(1)';
                }, 150);
            }
        }
        
        // 导出数据
        function exportData() {
            if (history.length === 0) {
                alert('没有数据可以导出！');
                return;
            }
            
            // 创建CSV内容
            let csv = '序号,数字,分类,时间\n';
            history.forEach((record, index) => {
                csv += `${index + 1},${record.number},${record.category},${record.time}\n`;
            });
            
            csv += `\n总计统计\n`;
            csv += `大单,${stats['大单']}\n`;
            csv += `小单,${stats['小单']}\n`;
            csv += `大双,${stats['大双']}\n`;
            csv += `小双,${stats['小双']}\n`;
            csv += `总计,${history.length}\n`;
            
            // 添加最近50个统计
            if (recentHistory.length > 0) {
                const recentStats = {
                    '大单': 0,
                    '小单': 0,
                    '大双': 0,
                    '小双': 0
                };
                
                recentHistory.forEach(record => {
                    recentStats[record.category]++;
                });
                
                csv += `\n最近${recentHistory.length}个数字统计\n`;
                csv += `大单,${recentStats['大单']}\n`;
                csv += `小单,${recentStats['小单']}\n`;
                csv += `大双,${recentStats['大双']}\n`;
                csv += `小双,${recentStats['小双']}\n`;
                csv += `总计,${recentHistory.length}\n`;
            }
            
            // 创建下载链接
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `数字统计_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 导出按钮动画
            exportBtn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                exportBtn.style.transform = 'scale(1)';
            }, 150);
        }
        
        // 切换标签页
        function switchTab(tabName) {
            // 更新标签
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }
        
        // 事件监听
        addBtn.addEventListener('click', addNumber);
        resetBtn.addEventListener('click', resetStats);
        exportBtn.addEventListener('click', exportData);
        
        // 按Enter键添加
        numberInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addNumber();
            }
        });
        
        // 页面加载时从本地存储加载数据
        window.addEventListener('load', function() {
            loadFromStorage();
            numberInput.focus();
        });
    </script>
</body>
